name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 21 * * *" # nightly, 03:17 Asia/Dhaka
  workflow_dispatch:
    inputs:
      markers:
        description: "pytest -m expression (e.g. smoke, 'api and not known_bug')"
        required: false
        default: ""
      app_ref:
        description: "mpl-season7 branch / tag / sha to test"
        required: false
        default: main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  APP_DIR: .app
  BASE_URL: http://127.0.0.1:8788
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: ci-only-${{ github.run_id }}

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test inventory
        run: pytest --collect-only -q | tail -n 1

  test:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: ui, path: tests/ui }
          - { name: api, path: tests/api }
          - { name: e2e, path: tests/e2e }
          - { name: a11y, path: tests/a11y }
    name: test (${{ matrix.suite.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Check out the application under test
        uses: actions/checkout@v4
        with:
          repository: Mahmud9248/mpl-season7
          ref: ${{ inputs.app_ref || 'main' }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: ${{ env.APP_DIR }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: playwright install --with-deps chromium

      - name: Start app (static site + Functions + local D1)
        run: ./scripts/run_local_app.sh --detach

      - name: Run ${{ matrix.suite.name }} tests
        run: >
          pytest ${{ matrix.suite.path }}
          -n auto
          ${{ inputs.markers && format('-m "{0}"', inputs.markers) || '' }}
          --reruns 1 --only-rerun "TimeoutError"
          --junitxml=test-results/junit-${{ matrix.suite.name }}.xml
          --alluredir=allure-results

      - name: Publish summary
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: test-results/junit-*.xml
          check_name: results (${{ matrix.suite.name }})
          include_passed: false
          detailed_summary: true

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.suite.name }}
          path: test-results/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.suite.name }}
          path: allure-results/
          retention-days: 7

      - name: App log
        if: failure()
        run: tail -n 100 "$APP_DIR/wrangler.log"

  cross-browser:
    # Nightly / manual only: smoke + mocked UI journeys on Firefox and WebKit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Mahmud9248/mpl-season7
          ref: ${{ inputs.app_ref || 'main' }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: ${{ env.APP_DIR }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps ${{ matrix.browser }}
      - run: ./scripts/run_local_app.sh --detach
      - run: >
          pytest tests/ui -m "smoke or mocked" -n auto
          --browser ${{ matrix.browser }}
          --junitxml=test-results/junit-${{ matrix.browser }}.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/

  report:
    needs: test
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results
      - name: Load report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - name: Build Allure report
        uses: simple-elf/allure-report-action@v1.12
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 30
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
